# Optional Nginx rate limiting for Lowkey Mandarin.
#
# limit_req_zone is only valid in the http {} context, not inside server {}.
# Put the two zones in /etc/nginx/nginx.conf (or a conf.d file included from
# http) and the location blocks inside the HTTPS server from
# nginx.conf.example.
#
# The app already limits requests per process. These proxy limits add a second
# layer that survives app restarts and covers every worker.

# http {} context:
limit_req_zone $binary_remote_addr zone=hanzi_read:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=hanzi_write:10m rate=1r/s;

